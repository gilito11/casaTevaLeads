# TEMPORAL: diagnostico Bright Data vs fotocasa. Borrar cuando fotocasa-bd funcione.
name: BD Debug (temporal)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe fotocasa URLs via Bright Data
        env:
          BD_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: |
          probe () {
            local label="$1"; local url="$2"; local render="$3"
            local payload
            if [ "$render" = "yes" ]; then
              payload=$(jq -n --arg u "$url" '{zone:"web_unlocker1", url:$u, format:"json", country:"es", render:"true"}')
            else
              payload=$(jq -n --arg u "$url" '{zone:"web_unlocker1", url:$u, format:"json", country:"es"}')
            fi
            echo "===== $label (render=$render) ====="
            resp=$(curl -s -w '\nCURL_HTTP:%{http_code}' -X POST https://api.brightdata.com/request \
              -H "Authorization: Bearer $BD_KEY" -H "Content-Type: application/json" \
              -d "$payload" --max-time 150)
            code=$(echo "$resp" | grep -o 'CURL_HTTP:[0-9]*' | cut -d: -f2)
            body=$(echo "$resp" | sed 's/CURL_HTTP:[0-9]*$//')
            echo "BD API HTTP: $code | resp bytes: ${#body}"
            # format=json -> {status_code, headers, body}
            echo "$body" | jq -r '"target status: \(.status_code // "n/a") | body bytes: \((.body // "") | length)"' 2>/dev/null || echo "no-json resp: $(echo "$body" | head -c 300)"
            echo "$body" | jq -r '.body // ""' 2>/dev/null | head -c 400 | tr -d '\0' || true
            echo ""
            total=$(echo "$body" | jq -r '.body // ""' 2>/dev/null | grep -o '"clientTypeId":[0-9]*' | wc -l)
            partic=$(echo "$body" | jq -r '.body // ""' 2>/dev/null | grep -o '"clientTypeId":1[,}]' | wc -l)
            echo "clientTypeId total: $total | particulares (==1): $partic"
            echo ""
          }
          fetch_body () {
            local url="$1"
            local payload=$(jq -n --arg u "$url" '{zone:"web_unlocker1", url:$u, format:"json", country:"es"}')
            curl -s -X POST https://api.brightdata.com/request \
              -H "Authorization: Bearer $BD_KEY" -H "Content-Type: application/json" \
              -d "$payload" --max-time 150 | jq -r '.body // ""'
          }

          echo "===== Inspeccion SPA config en /l lleida ====="
          fetch_body "https://www.fotocasa.es/es/comprar/viviendas/lleida-capital/todas-las-zonas/l" > /tmp/p1.html
          echo "p1 bytes: $(wc -c < /tmp/p1.html)"
          echo "--- endpoints api ---"
          grep -o 'https://[a-z.]*fotocasa[a-z./-]*' /tmp/p1.html | sort -u | head -15
          echo "--- sort hints ---"
          grep -o '"sort[A-Za-z]*"[^,}]*' /tmp/p1.html | sort -u | head -10
          grep -o 'sortType=[a-zA-Z]*' /tmp/p1.html | sort -u | head -10
          echo "--- primeros ids p1 ---"
          grep -o '"id":[0-9]\{7,\}' /tmp/p1.html | head -5

          echo "===== Estructura del API propertysearch ====="
          LOC="724,9,25,249,446,25120,0,0,0"
          API="https://web.gw.fotocasa.es/v2/propertysearch/search?combinedLocationIds=$LOC&transactionTypeId=1&pageNumber=1&sortType=publicationDate&pageSize=30"
          fetch_body "$API" > /tmp/api1.json
          echo "api1 bytes: $(wc -c < /tmp/api1.json)"
          echo "--- top-level keys ---"
          jq -r 'keys | join(", ")' /tmp/api1.json 2>/dev/null || head -c 300 /tmp/api1.json
          echo "--- count + array key ---"
          jq -r '.count // .totalResults // "n/a"' /tmp/api1.json 2>/dev/null
          jq -r 'to_entries[] | select(.value | type == "array") | "\(.key): \(.value | length) items"' /tmp/api1.json 2>/dev/null
          echo "--- keys del primer item ---"
          jq -r '.realEstates[0] // .items[0] // .results[0] | keys | join(", ")' /tmp/api1.json 2>/dev/null
          echo "--- primer item resumido ---"
          jq -r '.realEstates[0] // .items[0] // .results[0] | {id, clientTypeId, clientType, clientAlias, rawPrice, date, publicationDate, timeAgo, isNewConstruction, phone} ' /tmp/api1.json 2>/dev/null
          echo "--- clientTypeId distribucion p1 (sort fecha) ---"
          jq -r '[.realEstates[]?.clientTypeId] | group_by(.) | map("\(.[0]): \(length)") | join(" | ")' /tmp/api1.json 2>/dev/null
          echo "--- fechas primeros 5 (verificar sort) ---"
          jq -r '.realEstates[0:5][]? | "\(.id) \(.date // .publicationDate // "?") clientType=\(.clientTypeId)"' /tmp/api1.json 2>/dev/null
