# TEMPORAL: diagnostico Bright Data vs milanuncios. Borrar cuando milanuncios-bd funcione.
name: BD Debug (temporal)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe milanuncios via BD + parse INITIAL_PROPS like the scraper
        env:
          BD_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: |
          cat > /tmp/probe.py << 'EOF'
          import json, os, re, sys
          import urllib.request

          BD_KEY = os.environ["BD_KEY"]

          def bd_fetch(url):
              payload = json.dumps({"zone": "web_unlocker1", "url": url, "format": "raw", "country": "es"}).encode()
              req = urllib.request.Request("https://api.brightdata.com/request", data=payload,
                  headers={"Authorization": f"Bearer {BD_KEY}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=150) as r:
                  return r.read().decode("utf-8", errors="replace")

          def extract_props(html):
              m = re.search(r'window\.__INITIAL_PROPS__\s*=\s*JSON\.parse\(\s*"((?:\\.|[^"\\])*)"\s*\)', html, re.DOTALL)
              if m:
                  return json.loads(bytes(m.group(1), "utf-8").decode("unicode_escape"))
              m = re.search(r'window\.__INITIAL_PROPS__\s*=\s*({.+?})\s*;\s*(?:window\.|</script>)', html, re.DOTALL)
              if m:
                  return json.loads(m.group(1))
              return None

          def analyze(label, url):
              print(f"===== {label} =====")
              print(f"URL: {url}")
              try:
                  html = bd_fetch(url)
              except Exception as e:
                  print(f"  FETCH ERROR: {e}")
                  return
              print(f"  html bytes: {len(html)}")
              props = extract_props(html)
              if not props:
                  print("  INITIAL_PROPS: NO EXTRAIBLE")
                  return
              ads = None
              pag = props.get("adListPagination")
              if isinstance(pag, dict):
                  al = pag.get("adList")
                  if isinstance(al, dict):
                      ads = al.get("ads")
              if not ads:
                  ads = props.get("ads")
              if not ads:
                  print(f"  keys: {list(props.keys())[:15]}")
                  return
              print(f"  ads: {len(ads)}")
              dist = {}
              for ad in ads:
                  st = ad.get("sellerType")
                  v = st.get("value") if isinstance(st, dict) else st
                  dist[str(v)] = dist.get(str(v), 0) + 1
              print(f"  sellerType dist: {dist}")
              for ad in ads[:4]:
                  price = ad.get("price")
                  if isinstance(price, dict):
                      cp = price.get("cashPrice") or {}
                      price = cp.get("value") if isinstance(cp, dict) else price.get("value")
                  city = ad.get("city")
                  city = city.get("name") if isinstance(city, dict) else (city or ad.get("location"))
                  st = ad.get("sellerType")
                  st = st.get("value") if isinstance(st, dict) else st
                  print(f"    - id={ad.get('id')} city={city!r} seller={st} precio={price} {str(ad.get('title'))[:40]!r}")
              first_id = ads[0].get("id") if ads else None
              print(f"  first_id: {first_id}")
              # info de paginacion total
              if isinstance(pag, dict):
                  for k in ("totalPages", "totalResults", "currentPage", "pagination"):
                      if k in pag:
                          print(f"  pag.{k}: {pag[k]}")
              print()

          analyze("pisos lleida PART",        "https://www.milanuncios.com/venta-de-pisos-en-lleida-lleida/?vendedor=part")
          analyze("pisos lleida PART p2",     "https://www.milanuncios.com/venta-de-pisos-en-lleida-lleida/?vendedor=part&pagina=2")
          analyze("casas lleida PART",        "https://www.milanuncios.com/venta-de-casas-en-lleida-lleida/?vendedor=part")
          analyze("terrenos v2 lleida",       "https://www.milanuncios.com/venta-de-terrenos-en-lleida-lleida/")
          analyze("terrenos v2 lleida PART",  "https://www.milanuncios.com/venta-de-terrenos-en-lleida-lleida/?vendedor=part")
          analyze("pisos tarragona PART",     "https://www.milanuncios.com/venta-de-pisos-en-tarragona-tarragona/?vendedor=part")
          analyze("casas tarragona PART",     "https://www.milanuncios.com/venta-de-casas-en-tarragona-tarragona/?vendedor=part")
          EOF
          python3 /tmp/probe.py
