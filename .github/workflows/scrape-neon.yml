# Scraper workflow - Runs on GitHub Actions, saves to Neon PostgreSQL
# Cron DIARIO (sabado incluido): Wallapop + Habitaclia + Fotocasa sobre Lleida
# ciudad + pueblos <=20km. Fotocasa va via Bright Data Web Unlocker (por
# request, no por GB). Milanuncios/idealista solo por disparo manual.
# Free tier: 2000 min/mes.
name: Run Scrapers (Neon)

on:
  schedule:
    - cron: '0 12 * * *'  # Diario 12:00 UTC (14:00 Madrid) — sabado incluido
  workflow_dispatch:
    inputs:
      portals:
        description: 'Portals to scrape (comma-separated)'
        required: false
        default: 'habitaclia,fotocasa,milanuncios,wallapop'
      zones:
        description: 'Zones to scrape (comma-separated, empty=auto rotation)'
        required: false
        default: ''
      full_refresh:
        description: 'dbt --full-refresh (rebuilds incremental marts from scratch)'
        type: boolean
        required: false
        default: false

env:
  DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
  TENANT_ID: 1
  # Portales que corren en el cron programado (sin inputs). Manual los sobreescribe.
  # habitaclia funciona GRATIS desde runners US (no geo-bloquea, sin proxy) y es
  # el mejor productor. fotocasa y milanuncios van via Bright Data (pago por
  # request, credito disponible) -> todos a diario junto a wallapop.
  SCHEDULE_PORTALS: 'wallapop,habitaclia,fotocasa,milanuncios'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # scraping ~58min y subiendo; +margen para dbt + listing_checker + alertas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # ZONAS_GEOGRAFICAS now lives in scrapers/zones/* — no botasaurus or
          # camoufox dependency at runtime for Scrapling-only scrapes.
          # dbt pinned <1.10: dbt-postgres 1.10 pulls dbt-core 2.0 ("Fusion"),
          # whose Rust engine dropped the postgres adapter (dbt1005). Pin keeps
          # the classic 1.9 engine. scrapling + apify-fingerprint-datapoints
          # pineados como PAR exacto: scrapling hardcodea la version de Chrome y
          # si los datapoints publican datos sin esa version (paso 1-4 Ago 2026,
          # release 0.14.0) el import de StealthySession revienta con
          # "No headers based on this input can be generated".
          pip install "scrapling[fetchers]==0.4.12" "apify-fingerprint-datapoints==0.15.0" psycopg2-binary python-decouple python-dotenv "dbt-postgres>=1.9,<1.10" requests Pillow

      - name: Install Scrapling browsers (Patchright)
        run: scrapling install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Zonas por portal desde la BD (zonas_geograficas: activa + scrapear_<portal>).
      # Activar una zona desde el dashboard la mete en el cron sin tocar este
      # fichero. El input manual "zones" sobreescribe todos los portales; si la
      # BD falla, el script cae a la lista historica Lleida <=20km.
      - name: Determine zones for today
        id: zones
        run: |
          MANUAL_ZONES="${{ github.event.inputs.zones }}"
          if [ -n "$MANUAL_ZONES" ]; then
            for P in habitaclia fotocasa wallapop idealista; do
              echo "${P}=$MANUAL_ZONES" >> $GITHUB_OUTPUT
            done
            echo "Using manual zones: $MANUAL_ZONES"
          else
            for P in habitaclia fotocasa wallapop idealista; do
              ZONES=$(python scripts/get_active_zones.py --portal $P)
              echo "${P}=$ZONES" >> $GITHUB_OUTPUT
              echo "$P: $ZONES"
            done
          fi
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Run Habitaclia scraper (Scrapling)
        if: contains(github.event.inputs.portals || env.SCHEDULE_PORTALS, 'habitaclia')
        continue-on-error: true
        timeout-minutes: 40  # hard cap: es el mas lento (~31min) y variable; no debe ahogar dbt
        run: |
          ZONES="${{ steps.zones.outputs.habitaclia }}"
          python -m scrapers.scrapling_habitaclia --zones ${ZONES//,/ } --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Fotocasa geo-bloquea runners US. Bright Data Web Unlocker resuelve el
      # bypass como servicio gestionado y cobra POR REQUEST (~$0.0015), no por
      # GB como IPRoyal — con ~78 req/dia sale a ~$3.5/mes. El parser lee el
      # JSON embebido (clientTypeId) del HTML crudo, sin navegador.
      - name: Run Fotocasa scraper (Bright Data Web Unlocker)
        if: contains(github.event.inputs.portals || env.SCHEDULE_PORTALS, 'fotocasa')
        continue-on-error: true
        timeout-minutes: 20
        run: |
          ZONES="${{ steps.zones.outputs.fotocasa }}"
          python -m scrapers.scrapling_fotocasa_bd --zones ${ZONES//,/ } --max-pages 2 --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: web_unlocker1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Milanuncios via Bright Data + filtro ?vendedor=part (solo particulares
      # server-side). Zonas propias del scraper: lleida-lleida cubre la
      # PROVINCIA entera + pueblos; costa de Tarragona por municipio.
      # Detalle solo para anuncios nuevos -> ~$1-2/mes.
      - name: Run Milanuncios scraper (Bright Data Web Unlocker)
        if: contains(github.event.inputs.portals || env.SCHEDULE_PORTALS, 'milanuncios')
        continue-on-error: true
        timeout-minutes: 20
        run: |
          # max-pages 5: la paginacion corta sola en pagina vacia, asi que solo
          # pide p4/p5 si p3 trae contenido (hoy: 0 requests extra). Tarragona
          # llena la p1 (41/41) y con 3 habia poco margen.
          python -m scrapers.scrapling_milanuncios_bd --max-pages 5 --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: web_unlocker1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Wallapop geo-bloquea runners US. Bright Data Web Unlocker (country=es)
      # trae el HTML SSR con __NEXT_DATA__ sin navegador: 1 request por zona +
      # detalle solo de anuncios nuevos -> ~$0.5-1/mes.
      # (IPRoyal retirado 9 Jul 2026: ERR_TUNNEL_CONNECTION_FAILED)
      - name: Run Wallapop scraper (Bright Data Web Unlocker)
        if: contains(github.event.inputs.portals || env.SCHEDULE_PORTALS, 'wallapop')
        continue-on-error: true
        timeout-minutes: 20
        run: |
          ZONES="${{ steps.zones.outputs.wallapop }}"
          python -m scrapers.scrapling_wallapop_bd --zones ${ZONES//,/ } --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: web_unlocker1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Idealista scraper (Bright Data Web Unlocker — DataDome bypass managed)
        if: contains(github.event.inputs.portals || env.SCHEDULE_PORTALS, 'idealista')
        continue-on-error: true
        timeout-minutes: 20  # hard cap: a slow idealista must never starve dbt of the 60-min job budget
        run: |
          ZONES="${{ steps.zones.outputs.idealista }}"
          python -m scrapers.scrapling_idealista_bd --zones ${ZONES//,/ } --max-pages 1 --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: web_unlocker1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload debug HTML (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: output/debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Check portal health
        if: always()
        continue-on-error: true
        run: python scripts/check_portal_health.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run dbt transformations
        run: |
          cd dbt_project
          mkdir -p /tmp/dbt_profiles
          cat > /tmp/dbt_profiles/profiles.yml << EOF
          casa_teva:
            target: prod
            outputs:
              prod:
                type: postgres
                host: ep-ancient-darkness-agqilf7l-pooler.c-2.eu-central-1.aws.neon.tech
                port: 5432
                user: neondb_owner
                password: "$DBT_PASSWORD"
                dbname: neondb
                schema: public
                threads: 4
                sslmode: require
          EOF
          dbt deps --profiles-dir /tmp/dbt_profiles || true
          FR=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FR="--full-refresh"
            echo "dbt: running with --full-refresh"
          fi
          dbt run --select staging --profiles-dir /tmp/dbt_profiles $FR
          dbt run --select marts --profiles-dir /tmp/dbt_profiles $FR
        env:
          DBT_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}

      - name: Check removed listings (habitaclia + fotocasa)
        continue-on-error: true
        run: python -m scrapers.listing_checker --limit 200
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Auto-queue new leads for contact
        run: python scripts/post_scrape_auto_queue.py
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Price drop alerts
        continue-on-error: true
        run: python scripts/check_price_drops.py
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Validate scrape quality
        continue-on-error: true
        run: python scripts/validate_scrape_quality.py
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Portal performance study (Telegram summary)
        continue-on-error: true
        run: python -m scripts.portal_zone_report --telegram
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Summary
        run: |
          echo "## Scraping Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Portals: ${{ github.event.inputs.portals || env.SCHEDULE_PORTALS }}" >> $GITHUB_STEP_SUMMARY
          echo "- Zones (habitaclia): ${{ steps.zones.outputs.habitaclia }}" >> $GITHUB_STEP_SUMMARY
          echo "- dbt: Transformations applied" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: scrape
    runs-on: ubuntu-latest
    # failure() NO cubre timeouts (conclusion=cancelled) -> el fallo era silencioso.
    if: always() && (needs.scrape.result == 'failure' || needs.scrape.result == 'cancelled')
    steps:
      - name: Send failure notification via Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="🔴 <b>GH Actions Scraping FAILED/CANCELLED</b> (${{ needs.scrape.result }})%0A%0AWorkflow: scrape-neon.yml%0ACheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
