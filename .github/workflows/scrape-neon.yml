# Scraper workflow - Runs on GitHub Actions, saves to Neon PostgreSQL
# Zone rotation: Mon-Fri, core zones (salou,cambrils) every day + rotating secondary zones
# Free tier: 2000 min/month
name: Run Scrapers (Neon)

on:
  schedule:
    - cron: '0 12 * * 1'  # Monday
    - cron: '0 12 * * 3'  # Wednesday
    - cron: '0 12 * * 5'  # Friday
  workflow_dispatch:
    inputs:
      portals:
        description: 'Portals to scrape (comma-separated)'
        required: false
        default: 'habitaclia,fotocasa,idealista,milanuncios'
      zones:
        description: 'Zones to scrape (comma-separated, empty=auto rotation)'
        required: false
        default: ''
      full_refresh:
        description: 'dbt --full-refresh (rebuilds incremental marts from scratch)'
        type: boolean
        required: false
        default: false

env:
  DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
  TENANT_ID: 1

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Determine zones for today
        id: zones
        run: |
          MANUAL_ZONES="${{ github.event.inputs.zones }}"
          if [ -n "$MANUAL_ZONES" ]; then
            echo "zones=$MANUAL_ZONES" >> $GITHUB_OUTPUT
            echo "Using manual zones: $MANUAL_ZONES"
          else
            DAY=$(date -u +%u)
            # Zone rotation: 18 zones across 3 days L-X-V (~6 zones/day)
            # Saves proxy bandwidth vs 5 days
            case $DAY in
              1) ZONES="salou,cambrils,tarragona,reus,lleida,ametlla_mar" ;;
              3) ZONES="salou,cambrils,vendrell,calafell,balaguer,miami_platja" ;;
              5) ZONES="tarragona,reus,torredembarra,altafulla,mollerussa,valls" ;;
              *) ZONES="salou,cambrils,tarragona" ;;
            esac
            # Remaining zones (la_pineda,vila_seca,tarrega,tremp) via manual dispatch
            echo "zones=$ZONES" >> $GITHUB_OUTPUT
            echo "Day $DAY rotation: $ZONES"
          fi

      - name: Install dependencies
        run: |
          pip install "scrapling[fetchers]>=0.4.7" psycopg2-binary python-decouple python-dotenv dbt-postgres requests Pillow

      - name: Install Scrapling browsers (Patchright)
        run: scrapling install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Habitaclia scraper (Scrapling)
        if: contains(github.event.inputs.portals || 'habitaclia,fotocasa,idealista,milanuncios', 'habitaclia')
        continue-on-error: true
        run: |
          ZONES="${{ steps.zones.outputs.zones }}"
          python -m scrapers.scrapling_habitaclia --zones ${ZONES//,/ } --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Fotocasa scraper (Scrapling)
        if: contains(github.event.inputs.portals || 'habitaclia,fotocasa,idealista,milanuncios', 'fotocasa')
        continue-on-error: true
        run: |
          ZONES="${{ steps.zones.outputs.zones }}"
          python -m scrapers.scrapling_fotocasa --zones ${ZONES//,/ } --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Milanuncios scraper (Scrapling)
        if: contains(github.event.inputs.portals || 'habitaclia,fotocasa,idealista,milanuncios', 'milanuncios')
        continue-on-error: true
        run: |
          ZONES="${{ steps.zones.outputs.zones }}"
          python -m scrapers.scrapling_milanuncios --zones ${ZONES//,/ } --max-pages 2 --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Idealista scraper (Scrapling — DataDome bypass without proxy)
        if: contains(github.event.inputs.portals || 'habitaclia,fotocasa,idealista,milanuncios', 'idealista')
        continue-on-error: true
        run: |
          ZONES="${{ steps.zones.outputs.zones }}"
          python -m scrapers.scrapling_idealista --zones ${ZONES//,/ } --max-pages 2 --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload debug HTML (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: output/debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Check portal health
        if: always()
        continue-on-error: true
        run: python scripts/check_portal_health.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run dbt transformations
        run: |
          cd dbt_project
          mkdir -p /tmp/dbt_profiles
          cat > /tmp/dbt_profiles/profiles.yml << EOF
          casa_teva:
            target: prod
            outputs:
              prod:
                type: postgres
                host: ep-ancient-darkness-agqilf7l-pooler.c-2.eu-central-1.aws.neon.tech
                port: 5432
                user: neondb_owner
                password: "$DBT_PASSWORD"
                dbname: neondb
                schema: public
                threads: 4
                sslmode: require
          EOF
          dbt deps --profiles-dir /tmp/dbt_profiles || true
          FR=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FR="--full-refresh"
            echo "dbt: running with --full-refresh"
          fi
          dbt run --select staging --profiles-dir /tmp/dbt_profiles $FR
          dbt run --select marts --profiles-dir /tmp/dbt_profiles $FR
        env:
          DBT_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}

      - name: Check removed listings (habitaclia + fotocasa)
        continue-on-error: true
        run: python -m scrapers.listing_checker --limit 200
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Auto-queue new leads for contact
        run: python scripts/post_scrape_auto_queue.py
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Validate scrape quality
        continue-on-error: true
        run: python scripts/validate_scrape_quality.py
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Summary
        run: |
          echo "## Scraping Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Portals: ${{ github.event.inputs.portals || 'habitaclia,fotocasa,idealista,milanuncios' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Zones: ${{ steps.zones.outputs.zones }}" >> $GITHUB_STEP_SUMMARY
          echo "- dbt: Transformations applied" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: scrape
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send failure notification via Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="🔴 <b>GH Actions Scraping FAILED</b>%0A%0AWorkflow: scrape-neon.yml%0ACheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
