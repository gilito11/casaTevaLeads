# Scraper workflow for Tenant 2 (Look and Find - Madrid)
# Runs fotocasa + idealista for Chamartín + Hortaleza
# CRON DESACTIVADO (6 Jul 2026): Find&Look parado, no se va a vender.
# Producia ~0 leads (8 en total desde Feb). Reactivar descomentando schedule.
name: Run Scrapers - Madrid (Neon)

on:
  # schedule:
  #   - cron: '30 12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      portals:
        description: 'Portals to scrape (comma-separated)'
        required: false
        default: 'fotocasa,idealista'
      zones:
        description: 'Zones to scrape (comma-separated)'
        required: false
        default: 'chamartin,hortaleza'

env:
  DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
  TENANT_ID: 2

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # ZONAS_GEOGRAFICAS lives in scrapers/zones/* — Scrapling-only scrape.
          # dbt pinned <1.10: dbt-postgres 1.10 pulls dbt-core 2.0 ("Fusion"),
          # whose Rust engine dropped the postgres adapter (dbt1005). scrapling
          # pinned <0.5 to avoid surprise breaking upgrades on fresh installs.
          pip install "scrapling[fetchers]>=0.4.7,<0.5" psycopg2-binary python-decouple python-dotenv "dbt-postgres>=1.9,<1.10" requests Pillow

      - name: Install Scrapling browsers (Patchright)
        run: scrapling install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Fotocasa scraper (Scrapling)
        if: contains(github.event.inputs.portals || 'fotocasa,idealista', 'fotocasa')
        continue-on-error: true
        run: |
          ZONES="${{ github.event.inputs.zones || 'chamartin,hortaleza' }}"
          python -m scrapers.scrapling_fotocasa --zones ${ZONES//,/ } --tenant-id 2 --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Idealista scraper (Scrapling — DataDome bypass without proxy)
        if: contains(github.event.inputs.portals || 'fotocasa,idealista', 'idealista')
        continue-on-error: true
        run: |
          ZONES="${{ github.event.inputs.zones || 'chamartin,hortaleza' }}"
          python -m scrapers.scrapling_idealista --zones ${ZONES//,/ } --tenant-id 2 --max-pages 2 --postgres
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload debug HTML (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-madrid
          path: output/debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Run dbt transformations
        run: |
          cd dbt_project
          mkdir -p /tmp/dbt_profiles
          cat > /tmp/dbt_profiles/profiles.yml << EOF
          casa_teva:
            target: prod
            outputs:
              prod:
                type: postgres
                host: ep-ancient-darkness-agqilf7l-pooler.c-2.eu-central-1.aws.neon.tech
                port: 5432
                user: neondb_owner
                password: "$DBT_PASSWORD"
                dbname: neondb
                schema: public
                threads: 4
                sslmode: require
          EOF
          dbt deps --profiles-dir /tmp/dbt_profiles || true
          dbt run --select staging --profiles-dir /tmp/dbt_profiles
          dbt run --select marts --profiles-dir /tmp/dbt_profiles
        env:
          DBT_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}

      - name: Auto-queue new leads for contact
        run: python scripts/post_scrape_auto_queue.py
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Summary
        run: |
          echo "## Madrid Scraping Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Tenant: 2 (Look and Find)" >> $GITHUB_STEP_SUMMARY
          echo "- Portals: ${{ github.event.inputs.portals || 'fotocasa,idealista' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Zones: ${{ github.event.inputs.zones || 'chamartin,hortaleza' }}" >> $GITHUB_STEP_SUMMARY
          echo "- dbt: Transformations applied" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: scrape
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send failure notification via Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="🔴 <b>GH Actions Madrid Scraping FAILED</b>%0A%0ATenant: 2 (Look and Find)%0AWorkflow: scrape-madrid.yml%0ACheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
